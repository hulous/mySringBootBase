spring:
  application:
    name: base
  config:
    import: "./env.properties"
  datasource:
    url: "jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false"
    username: "${DB_USER}"
    password: "${DB_PASSWORD}"
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: "${MAIN_APP_PORT}"

security:
  jwt:
    secret-key: "${JWT_SECRET_TOKEN}"
    expiration-time: 3600000 # 1h in millisecond
